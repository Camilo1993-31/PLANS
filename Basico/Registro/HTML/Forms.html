<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/../Image/Colombia.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <link rel="stylesheet" href="../CSS/Forms.css">
</head>

<body class="fondo">
    <form class="cuerpo">
        <h2 class="titulo">REGISTRO DE USUARIO</h2>
        <div class="form_input">
            <label class=""> Fecha
                <input type="date" name="fecha_ingreso" required>
            </label>
        </div>
        <fieldset>
            <legend>Información Basica</legend>
            <div class="form_input">
                <label>Nombre 
                    <input type="text" placeholder="Camilo" required>
                </label>
            </div>
            <div class="form_input">
                <label>Apellidos 
                    <input type="text" placeholder="Montealegre" required>
                </label>
            </div>
        </fieldset>
        <fieldset>
            <legend>Contactos</legend>
            <div class="form_input">
                <label>Telefono
                    <input type="numerico" placeholder="(+57)" required>
                </label>
            </div>
            <div class="form_input">
                <label>Email
                    <input type="email" placeholder="camilo@example.com" required>
                </label>
            </div>
        </fieldset>
        <fieldset>
            <legend>Contraseñas</legend>
            <div class="form_input">
                <label>Contraseña
                    <input type="password" placeholder="********" required> 
                </label> 
            </div>
            <div class="form_input">
                <label> Verificar Contraseña
                    <input type="password" placeholder="********" required> 
                </label> 
            </div>
        </fieldset>
        <div class="ingresar">
            <input type="submit" value="Ingresar">
        </div>

        <h2>Información Adicional</h2>
        <div class="archivo">
            <label>
                <input type="file" name="Cargar archivo">
            </label>
        </div>
            <label>Acepto Terminos y Condiciones
                <input type="checkbox" name="terminos" required>
            </label>
        <div class="enviar">
            <input type="submit" value="Enviar">
        </div>
    </form>
</body>
</html>
